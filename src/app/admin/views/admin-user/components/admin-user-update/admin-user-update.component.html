<div class="flex-1 flex flex-col">
  <div class="flex items-center justify-end gap-4 bg-white mt-2 p-4 rounded-xl shadow mx-6">
    <button
      class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-700"
      routerLink="/admin/platform/user"
    >
      Regresar
    </button>
  </div>

  <main class="p-6 flex justify-center">
    <div class="w-full max-w-lg rounded-xl bg-white p-8 shadow">
      <h1 class="text-2xl font-semibold text-slate-700 mb-6">
        {{ isNew ? 'Nuevo Usuario' : 'Editar Usuario' }}
      </h1>

      <div class="space-y-5" [formGroup]="formGroup">

        <div>
          <label class="block text-sm font-medium text-slate-700">Username</label>
          <input
            type="text"
            formControlName="username"
            placeholder="Ej. jperez"
            class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 shadow-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700">Nombre completo</label>
          <input
            type="text"
            formControlName="fullName"
            placeholder="Juan Pérez"
            class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 shadow-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700">
            Contraseña {{ !isNew ? '(dejar vacío para no cambiar)' : '' }}
          </label>
          <input
            type="password"
            formControlName="password"
            placeholder="{{ isNew ? 'Mínimo 8 caracteres' : 'Nueva contraseña (opcional)' }}"
            class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 shadow-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700">Rol</label>
          <select
            formControlName="roleId"
            class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
          >
            <option value="" disabled>-- Selecciona un rol --</option>
            @for (role of roleList; track role.uuid) {
              <option [value]="role.uuid">{{ role.name }}</option>
            }
          </select>
        </div>

        <div class="flex items-center gap-2">
          <input
            type="checkbox"
            id="status"
            formControlName="status"
            class="h-4 w-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500"
          />
          <label for="status" class="text-sm font-medium text-slate-700">Activo</label>
        </div>

        <div class="pt-4">
          <button
            type="button"
            (click)="onSave()"
            [disabled]="formGroup.invalid"
            class="w-full rounded-lg bg-indigo-600 px-4 py-2.5 text-center text-sm font-semibold text-white shadow-sm hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 disabled:opacity-50"
          >
            Guardar
          </button>
        </div>

      </div>
    </div>
  </main>
</div>
