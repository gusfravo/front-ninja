    <!-- Contenido principal -->
    <div class="flex-1 flex flex-col">
      <!-- Main -->
      <main class="p-6 space-y-6">
        <!-- Controles de listado -->
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 bg-white p-4 rounded-xl shadow">
          <div class="flex items-center gap-2">
            <button
              class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-700"
              routerLink="/admin/platform/catalog/events/workshop"
            >
              Regresar
            </button>
          </div>

          <div class="flex items-center gap-2">
            <input
              type="text"
              placeholder="Buscar una prestación..."
              class="rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
            />
            <button
              class="rounded-md bg-slate-600 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-700"
              [routerLink]="'/admin/platform/catalog/events/workshop/members/' + uuid"
            >
              Ver todos los agremiados
            </button>
            <button
              class="rounded-md bg-emerald-600 px-4 py-2 text-sm font-semibold text-white hover:bg-emerald-700"
              (click)="exportGeneralExcel()"
            >Descargar Excel general</button>
            <button
              class="rounded-md bg-teal-600 px-4 py-2 text-sm font-semibold text-white hover:bg-teal-700"
              (click)="openDependenceModal()"
            >Excel por dependencia</button>
            <button
              class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-700"
              (click)="openNewModal()"
            >+ Nueva entrada</button>
          </div>
        </div>

        <div class="rounded-xl bg-white p-6 shadow">
          <h3 class="text-lg font-semibold text-slate-700 mb-4">Listado de Eventos</h3>
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse text-sm">
              <thead>
                <tr class="border-b text-slate-600">
                  <th class="py-2 px-3">ID</th>
                  <th class="py-2 px-3">Delegación</th>
                  <th class="py-2 px-3">Acciones</th>
                </tr>
              </thead>
              <tbody class="text-sm divide-y divide-slate-200">
              @for (item of instanceList; track item.uuid; let i = $index;) {
                <tr class="hover:bg-slate-50">
                  <td class="py-2 px-3">{{i+1}}</td>
                  <td class="py-2 px-3">{{item.deletation.name}}</td>
                  <td class="py-2 px-3 flex gap-2">
                    <button class="rounded-md bg-blue-500 px-3 py-1 text-white text-xs hover:bg-blue-600"
                    (click)="openEditModal(item)">Editar</button>
                    <button class="rounded-md bg-green-600 px-3 py-1 text-white text-xs hover:bg-green-700"
                    [routerLink]="'/admin/platform/catalog/events/workshop/file/'+uuid+'/'+item.uuid">Agregar agremiado</button>
                    <button class="rounded-md bg-amber-500 px-3 py-1 text-white text-xs hover:bg-amber-600"
                    (click)="exportExcel(item)">Exportar Excel</button>
                    <button class="rounded-md bg-green-600 px-3 py-1 text-white text-xs hover:bg-green-700"
                    [disabled]="downloadingFormatId === item.uuid"
                    (click)="exportFormatExcel(item)">
                      {{ downloadingFormatId === item.uuid ? 'Descargando...' : 'Excel Formato' }}
                    </button>
                  </td>
                </tr>
              }
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>

<!-- Modal selección de dependencia para Excel -->
<div *ngIf="showDependenceModal"
     class="fixed inset-0 z-50 flex items-center justify-center bg-black/40">
  <div class="bg-white rounded-xl shadow-xl w-full max-w-sm p-6">

    <div class="flex justify-between items-center mb-4">
      <h2 class="text-lg font-semibold text-gray-800">Excel por dependencia</h2>
      <button class="text-gray-500 hover:text-gray-700 text-xl leading-none"
              (click)="closeDependenceModal()">✕</button>
    </div>

    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1">Dependencia</label>
      @if (availableDependences.length === 0) {
        <p class="text-sm text-amber-600">Ningún registro tiene dependencia asignada.</p>
      } @else {
        <select
          [(ngModel)]="selectedDependenceIdForExcel"
          class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500"
        >
          <option value="" disabled>-- Selecciona una dependencia --</option>
          @for (dep of availableDependences; track dep.uuid) {
            <option [value]="dep.uuid">{{ dep.name }}</option>
          }
        </select>
      }
    </div>

    <div class="flex justify-end gap-3">
      <button
        class="px-4 py-2 rounded-lg bg-gray-200 hover:bg-gray-300 text-sm"
        (click)="closeDependenceModal()"
        [disabled]="downloadingDependence"
      >Cancelar</button>
      <button
        class="px-4 py-2 rounded-lg bg-teal-600 text-white hover:bg-teal-700 text-sm disabled:opacity-50"
        (click)="exportByDependence()"
        [disabled]="!selectedDependenceIdForExcel || downloadingDependence || availableDependences.length === 0"
      >
        {{ downloadingDependence ? 'Descargando...' : 'Descargar Excel' }}
      </button>
    </div>

  </div>
</div>
